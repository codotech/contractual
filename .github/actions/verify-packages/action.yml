name: Verify packed packages
description: Pack, install, and smoke-test local packages without publishing or tagging
runs:
  using: composite
  steps:
    - name: Pack workspace packages
      id: pack
      shell: bash
      run: |
        package_dir="$(mktemp -d "$RUNNER_TEMP/contractual-packages.XXXXXX")"
        echo "directory=$package_dir" >> "$GITHUB_OUTPUT"
        pnpm -r exec pnpm pack --pack-destination "$package_dir"
    - name: Verify and install tarballs
      shell: bash
      env:
        PACKAGE_DIR: ${{ steps.pack.outputs.directory }}
      run: |
        jq -n '{private: true, type: "module", dependencies: {}, overrides: {}}' > "$PACKAGE_DIR/package.json"
        for tarball in "$PACKAGE_DIR"/*.tgz; do
          contents="$(tar -tzf "$tarball")"
          grep -qx 'package/dist/index.js' <<< "$contents"
          if grep -Eq '\.(test|spec)\.[cm]?[jt]s$' <<< "$contents"; then
            echo "Tests must not be included in $tarball" >&2
            exit 1
          fi
          manifest="$(tar -xOzf "$tarball" package/package.json)"
          jq -e '[.dependencies // {} | .[] | startswith("workspace:")] | any | not' <<< "$manifest" > /dev/null
          package_name="$(jq -r '.name' <<< "$manifest")"
          jq --arg name "$package_name" --arg file "file:$tarball" '.dependencies[$name] = $file | .overrides[$name] = $file' "$PACKAGE_DIR/package.json" > "$PACKAGE_DIR/package.tmp.json"
          mv "$PACKAGE_DIR/package.tmp.json" "$PACKAGE_DIR/package.json"
        done
        cd "$PACKAGE_DIR"
        npm install --ignore-scripts --no-audit --no-fund --package-lock=false
        while IFS= read -r package_name; do
          node --input-type=module -e 'await import(process.argv[1])' "$package_name"
        done < <(jq -r '.dependencies | keys[]' package.json)
    - name: Smoke-test the installed CLI
      shell: bash
      env:
        PACKAGE_DIR: ${{ steps.pack.outputs.directory }}
      run: |
        cd "$PACKAGE_DIR"
        jq -n '{"$schema": "http://json-schema.org/draft-07/schema#", type: "object", properties: {id: {type: "string"}}}' > order.schema.json
        cli=node_modules/@contractual/cli/bin/cli.js
        node "$cli" --help
        node "$cli" init --yes
        node "$cli" lint
        node "$cli" diff --format json
        node "$cli" status

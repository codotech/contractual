name: Publish Packages
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full reviewed commit SHA on next, explicitly approved by Omer
        required: true
        type: string
      dist_tag:
        description: Approved npm distribution tag
        type: choice
        options: [dev, next, rc, alpha, beta, latest]
        default: dev
        required: true
permissions:
  id-token: write
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/next'
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - name: Verify approved commit belongs to next
        env:
          APPROVED_COMMIT: ${{ inputs.commit }}
        run: |
          [[ "$APPROVED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$APPROVED_COMMIT"
          git merge-base --is-ancestor HEAD origin/next
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:e2e
      - name: Check npm authorization and package metadata
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          case "$DIST_TAG" in dev|next|rc|alpha|beta|latest) ;; *) exit 1 ;; esac
          test -n "$NODE_AUTH_TOKEN"
          npm_user="$(npm whoami --registry=https://registry.npmjs.org/)"
          package_access="$(npm access list packages "$npm_user" --json)"
          for manifest in packages/*/package.json; do
            if jq -e '.private == true' "$manifest" > /dev/null; then continue; fi
            package_name="$(jq -r '.name' "$manifest")"
            jq -e '.repository.url == "https://github.com/codotech/contractual.git" and .publishConfig.access == "public"' "$manifest" > /dev/null
            jq -e --arg name "$package_name" '.[$name] == "read-write"' <<< "$package_access" > /dev/null
            if [ "$DIST_TAG" = latest ]; then
              jq -e '.version | contains("-") | not' "$manifest" > /dev/null
            fi
            echo "$package_name: publishing preflight passed ($DIST_TAG)"
          done
      - name: Publish approved versions (does not create Git tags)
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm exec lerna publish from-package --yes --dist-tag "$DIST_TAG" --no-git-reset

name: Publish Packages
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full reviewed commit SHA on next, explicitly approved by Omer
        required: true
        type: string
      dist_tag:
        description: Approved npm distribution tag
        type: choice
        options: [dev, next, rc, alpha, beta, latest]
        default: dev
        required: true
permissions:
  id-token: write
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/next'
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - name: Verify approved commit belongs to next
        env:
          APPROVED_COMMIT: ${{ inputs.commit }}
        run: |
          [[ "$APPROVED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$APPROVED_COMMIT"
          git merge-base --is-ancestor HEAD origin/next
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm pack:check
      - name: Check npm authorization and package metadata
        run: node scripts/release-preflight.mjs
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish approved versions (does not create Git tags)
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm exec lerna publish from-package --yes --dist-tag "$DIST_TAG" --no-git-reset

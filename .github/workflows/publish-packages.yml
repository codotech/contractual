name: Publish Packages
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full reviewed commit SHA on next, explicitly approved by Omer
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/next'
    environment: release
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    permissions:
      id-token: write
      contents: read
    env:
      APPROVED_COMMIT: ${{ inputs.commit }}
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
    steps:
      - uses: actions/checkout@v7
        with:
          ref: next
          fetch-depth: 0
          persist-credentials: false
      - name: Verify and select the exact approved commit
        run: |
          [[ "$APPROVED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$APPROVED_COMMIT" origin/next
          git switch --detach "$APPROVED_COMMIT"
          test "$(git rev-parse HEAD)" = "$APPROVED_COMMIT"
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: |
          report="$RUNNER_TEMP/dependency-audit.json"
          audit_status=0
          pnpm audit --json > "$report" || audit_status=$?
          cat "$report"
          # Registry errors, muted findings, unexpected statuses/schema must fail closed.
          jq -e --argjson status "$audit_status" '
            type == "object" and (has("error") | not) and .muted == [] and
            (.advisories | type == "object") and
            (.metadata.vulnerabilities | keys == ["critical", "high", "info", "low", "moderate"]) and
            (.metadata.vulnerabilities | all(.[]; type == "number" and . >= 0)) and
            (([.metadata.vulnerabilities[]] | add) == ([.advisories[].findings | length] | add // 0)) and
            (($status == 0 and (.advisories | length) == 0) or
             ($status == 1 and (.advisories | length) > 0)) and
            (.advisories | all(.[];
              (.module_name | type == "string") and
              (.findings | type == "array" and length > 0) and
              (.findings | all(.[]; (.version | type == "string") and
                (.paths | type == "array" and length > 0) and
                (.paths | all(.[]; type == "string"))))))
          ' "$report" > /dev/null
          if ! jq -e '.advisories | length == 0' "$report" > /dev/null; then
            echo "::error::Dependency audit found vulnerabilities. All findings must be resolved."
            exit 1
          fi
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:e2e
      - name: Plan independent package publication
        id: publication
        run: |
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          plan="$RUNNER_TEMP/package-publication.jsonl"
          : > "$plan"
          pending=0
          for manifest in packages/*/package.json; do
            if jq -e '.private == true' "$manifest" > /dev/null; then continue; fi
            jq -e '.repository.url == "https://github.com/codotech/contractual.git" and .publishConfig.access == "public" and (.version | test("^[0-9]+\\.[0-9]+\\.[0-9]+-beta\\.[0-9]+$"))' "$manifest" > /dev/null
            package_name="$(jq -r '.name' "$manifest")"
            version="$(jq -r '.version' "$manifest")"
            package_path="${manifest%/package.json}"
            tag="$package_name@$version"
            if git show-ref --verify --quiet "refs/tags/$tag"; then
              tagged_commit="$(git rev-parse "refs/tags/$tag^{commit}")"
              if ! git merge-base --is-ancestor "$tagged_commit" "$APPROVED_COMMIT" ||
                 ! git diff --quiet "$tagged_commit" "$APPROVED_COMMIT" -- "$package_path"; then
                echo "::error::$tag conflicts with the approved package contents. Prepare a new version; existing tags are immutable."
                exit 1
              fi
            fi
            if npm view "$package_name@$version" --json > "$RUNNER_TEMP/registry-package.json"; then
              jq -e --arg name "$package_name" --arg version "$version" '
                (has("error") | not) and .name == $name and .version == $version and
                (.gitHead | type == "string" and test("^[0-9a-f]{40}$"))
              ' "$RUNNER_TEMP/registry-package.json" > /dev/null
              published_commit="$(jq -r '.gitHead' "$RUNNER_TEMP/registry-package.json")"
              if ! git cat-file -e "$published_commit^{commit}" ||
                 ! git merge-base --is-ancestor "$published_commit" "$APPROVED_COMMIT" ||
                 ! git diff --quiet "$published_commit" "$APPROVED_COMMIT" -- "$package_path"; then
                echo "::error::$tag is already published from different package contents or unrelated history. Prepare a new version."
                exit 1
              fi
              npm view "$package_name" dist-tags --json > "$RUNNER_TEMP/registry-dist-tags.json"
              jq -e 'type == "object" and (has("error") | not) and all(.[]; type == "string")' "$RUNNER_TEMP/registry-dist-tags.json" > /dev/null
              expected_beta="$(jq -c '.beta // null' "$RUNNER_TEMP/registry-dist-tags.json")"
              expected_commit="$published_commit"
              disposition=preserve
            else
              # Only an explicit registry E404 means this version can be published.
              jq -e '.error.code == "E404"' "$RUNNER_TEMP/registry-package.json" > /dev/null
              expected_commit="$APPROVED_COMMIT"
              expected_beta="$(jq -cn --arg version "$version" '$version')"
              disposition=publish
              pending=$((pending + 1))
            fi
            jq -cn --arg name "$package_name" --arg version "$version" \
              --arg git_head "$expected_commit" --arg disposition "$disposition" \
              --argjson beta "$expected_beta" \
              '{name: $name, version: $version, gitHead: $git_head, disposition: $disposition, beta: $beta}' >> "$plan"
            echo "$tag: $disposition"
          done
          test -s "$plan"
          echo "pending=$pending" >> "$GITHUB_OUTPUT"
      - name: Publish missing versions to beta with npm Trusted Publishing
        if: steps.publication.outputs.pending != '0'
        run: pnpm exec lerna publish from-package --yes --dist-tag beta --git-head "$APPROVED_COMMIT" --no-git-reset
      - name: Verify each package against its publication plan
        env:
          NPM_CONFIG_FETCH_RETRIES: '0'
          NPM_CONFIG_FETCH_TIMEOUT: '10000'
        run: |
          verification_deadline=$((SECONDS + 600))
          while IFS= read -r entry; do
            package_name="$(jq -r '.name' <<< "$entry")"
            version="$(jq -r '.version' <<< "$entry")"
            expected_commit="$(jq -r '.gitHead' <<< "$entry")"
            expected_beta="$(jq -c '.beta' <<< "$entry")"
            disposition="$(jq -r '.disposition' <<< "$entry")"
            while true; do
              if npm view "$package_name@$version" --json --prefer-online > "$RUNNER_TEMP/published-package.json"; then
                # A visible version with unexpected ownership is never a visibility retry.
                if ! jq -e --arg name "$package_name" --arg version "$version" --arg sha "$expected_commit" \
                  '.name == $name and .version == $version and .gitHead == $sha' \
                  "$RUNNER_TEMP/published-package.json" > /dev/null; then
                  echo "::error::$package_name@$version has unexpected package identity or gitHead."
                  exit 1
                fi
                if npm view "$package_name" dist-tags --json --prefer-online > "$RUNNER_TEMP/published-dist-tags.json"; then
                  jq -e 'type == "object" and (has("error") | not) and all(.[]; type == "string")' \
                    "$RUNNER_TEMP/published-dist-tags.json" > /dev/null
                  if jq -e --argjson beta "$expected_beta" '(.beta // null) == $beta' \
                    "$RUNNER_TEMP/published-dist-tags.json" > /dev/null; then
                    break
                  fi
                  if [[ "$disposition" != publish ]]; then
                    echo "::error::The beta tag changed for preserved package $package_name."
                    exit 1
                  fi
                else
                  test "$disposition" = publish
                  jq -e '.error.code == "E404"' "$RUNNER_TEMP/published-dist-tags.json" > /dev/null
                fi
              else
                # New uploads can return E404 briefly before npm exposes the version.
                # Authentication, server errors, and missing preserved versions still fail.
                test "$disposition" = publish
                jq -e '.error.code == "E404"' "$RUNNER_TEMP/published-package.json" > /dev/null
              fi
              if (( SECONDS >= verification_deadline )); then
                echo "::error::Timed out waiting for npm visibility of $package_name@$version and its beta tag. Check the registry before retrying publication."
                exit 1
              fi
              echo "$package_name@$version: waiting for npm registry visibility; retrying read-only verification in 10 seconds."
              sleep 10
            done
            printf '\n- `%s@%s`: %s, verified at `%s`\n' \
              "$package_name" "$version" "$disposition" "$expected_commit" >> "$GITHUB_STEP_SUMMARY"
          done < "$RUNNER_TEMP/package-publication.jsonl"

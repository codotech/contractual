name: Prepare Release
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Use preminor to enter beta, prerelease for the next beta
        type: choice
        options: [preminor, prerelease]
        default: preminor
        required: true
      preid:
        description: Prerelease identifier
        type: choice
        options: [beta]
        default: beta
        required: true
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/next'
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: next
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm test:e2e
      - name: Prepare version changes without tags
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          PREID: ${{ inputs.preid }}
        run: |
          test "$PREID" = beta
          case "$RELEASE_TYPE" in preminor|prerelease) ;; *) exit 1 ;; esac
          git switch -c "chore/release-${GITHUB_RUN_ID}"
          pnpm exec lerna version "$RELEASE_TYPE" --preid "$PREID" --conventional-commits --yes --no-git-tag-version --no-push --no-commit-hooks --ignore-scripts --allow-branch "chore/release-${GITHUB_RUN_ID}"
          pnpm install --lockfile-only --ignore-scripts
      - name: Open a release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo 'No version changes to prepare.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages pnpm-lock.yaml
          git -c core.hooksPath=/dev/null commit -m 'chore(*): prepare beta packages'
          git -c credential.helper='!gh auth git-credential' push origin "HEAD:refs/heads/chore/release-${GITHUB_RUN_ID}"
          gh pr create --base next --head "chore/release-${GITHUB_RUN_ID}" --title 'chore(*): prepare beta packages' --body 'Review package versions and validation before merging. This PR does not tag or publish. Publishing requires a separate explicit approval from Omer. Approve the bot PR workflow runs if GitHub requests it.'

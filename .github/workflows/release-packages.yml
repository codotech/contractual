name: Prepare Release
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Approved release type
        type: choice
        options: [prerelease, graduate]
        default: prerelease
        required: true
      preid:
        description: Prerelease identifier
        type: choice
        options: [dev, next, rc, alpha, beta]
        default: dev
        required: true
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/next'
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: next
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm test:e2e
      - name: Prepare version changes without tags
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          PREID: ${{ inputs.preid }}
        run: |
          git switch -c "chore/release-${GITHUB_RUN_ID}"
          if [ "$RELEASE_TYPE" = graduate ]; then
            pnpm exec lerna version --conventional-graduate --yes --no-git-tag-version --no-push --no-commit-hooks --allow-branch "chore/release-${GITHUB_RUN_ID}"
          else
            pnpm exec lerna version --conventional-commits --conventional-prerelease --preid "$PREID" --yes --no-git-tag-version --no-push --no-commit-hooks --allow-branch "chore/release-${GITHUB_RUN_ID}"
          fi
      - name: Open a release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo 'No version changes to prepare.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages pnpm-lock.yaml
          git commit -m 'chore: prepare package versions'
          git push origin "HEAD:refs/heads/chore/release-${GITHUB_RUN_ID}"
          gh pr create --base next --head "chore/release-${GITHUB_RUN_ID}" --title 'chore: prepare package versions' --body 'Review package versions and validation before merging. This PR does not tag or publish. Publishing requires a separate explicit approval from Omer. Because this PR uses GITHUB_TOKEN, a maintainer must reopen it to trigger PR checks.'

name: Pull request title
on:
  pull_request:
    branches: [next]
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  pull-requests: read
jobs:
  title:
    name: PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          scopes: |
            cli
            changesets
            types
            governance
            differs\.core
            differs\.json-schema
            differs\.openapi
            \*
          requireScope: false
          subjectPattern: '^\S[^\r\n]*$'

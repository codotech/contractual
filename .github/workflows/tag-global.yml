name: Tag and Push

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag Name (e.g. v1.0.0)'
        required: true
      commit:
        description: 'Full reviewed commit SHA on next, explicitly approved by Omer'
        required: true
        type: string

permissions:
  contents: write

jobs:
  tag-and-push:
    if: github.ref == 'refs/heads/next'
    environment: release
    name: Tag and Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0

      - name: Verify approved commit
        env:
          APPROVED_COMMIT: ${{ inputs.commit }}
        run: |
          [[ "$APPROVED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$APPROVED_COMMIT"
          git merge-base --is-ancestor HEAD origin/next

      - name: Config Git
        run: |
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git config --global user.name "${{ github.actor }}"

      - name: Tag and Push
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          git check-ref-format "refs/tags/$TAG_NAME"
          git tag -a "$TAG_NAME" -m "Tag Version $TAG_NAME"
          git push origin "refs/tags/$TAG_NAME"

      - name: Generate Summary
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          echo "## Tag Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** \`$TAG_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`$(git rev-parse HEAD)\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`$(git rev-parse --abbrev-ref HEAD)\`" >> $GITHUB_STEP_SUMMARY

name: Continuous Integration
on:
  pull_request:
    branches: [next]
  push:
    branches: [next]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:e2e
  ci:
    name: CI
    if: always()
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - name: Require every verification job
        env:
          RESULT: ${{ needs.verify.result }}
        run: test "$RESULT" = success

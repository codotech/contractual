name: Release Preview
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Release type to preview locally
        type: choice
        options: [prerelease, graduate, auto]
        default: auto
        required: true
      preid:
        description: Prerelease identifier
        type: choice
        options: [dev, next, rc, alpha, beta]
        default: next
        required: true
permissions:
  contents: read
jobs:
  preview:
    name: Preview Release
    if: github.ref == 'refs/heads/next'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: next
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Deliberately do not read or write caches in release workflows.
      - run: pnpm install --frozen-lockfile
      - name: Preview versions without commits, tags, or publication
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          PREID: ${{ inputs.preid }}
        run: |
          case "$PREID" in dev|next|rc|alpha|beta) ;; *) exit 1 ;; esac
          args=(--yes --no-git-tag-version --no-push --no-commit-hooks --allow-branch next)
          case "$RELEASE_TYPE" in
            prerelease) pnpm exec lerna version prerelease --preid "$PREID" "${args[@]}" ;;
            graduate) pnpm exec lerna version --conventional-graduate "${args[@]}" ;;
            auto) pnpm exec lerna version --conventional-commits "${args[@]}" ;;
            *) exit 1 ;;
          esac
      - name: Summarize local preview
        run: |
          echo '## Proposed versions (preview only)' >> "$GITHUB_STEP_SUMMARY"
          pnpm exec lerna ls --json | jq -r '.[] | "- **\(.name)**: \(.version)"' >> "$GITHUB_STEP_SUMMARY"
          echo 'No commits, tags, or packages were published. Ask Omer before preparing or publishing a release.' >> "$GITHUB_STEP_SUMMARY"

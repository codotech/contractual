openapi: 3.1.0
info:
  title: Required properties API
  version: 1.0.0
paths:
  /agents:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                goals:
                  type: array
                  items:
                    type: string
              required:
                - name
                - goals
      responses:
        '200':
          description: Agent
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  goals:
                    type: array
                    items:
                      type: string
                required:
                  - id
                  - goals
